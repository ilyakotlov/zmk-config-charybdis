# Increase BLE transmit power for dongle
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable deep sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Configure split keyboard - expect 2 peripherals (left + right)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Fetch battery levels from peripherals for display (pair left first, then right for correct order)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Enable input/pointing support for receiving trackball data from peripheral
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# ZDSE (zmk-dongle-screen-engine) theme selection
CONFIG_ZDSE_NEON_CAT_THEME=y

# ZDSE engine tuning
# Brightness percent (no ambient light sensor on this dongle)
CONFIG_ZMK_DONGLE_SCREEN_BRIGHTNESS=50
# Conservative scheduling target for the 30 MHz SPI transport; upstream's
# neon-cat demo uses 60 if the panel handles it
CONFIG_ZMK_DONGLE_SCREEN_FPS=30

# Report the active layer to the host (ZMK Layer Monitor, needs the pfilipp/zmk fork)
CONFIG_ZMK_HID_LAYER_STATE_REPORT=y
